<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd9c9"/><stop offset="100%" stop-color="#ffb59a"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f3550"/><stop offset="100%" stop-color="#171b2c"/>
    </linearGradient>
    <linearGradient id="jacket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b3d"/><stop offset="100%" stop-color="#e8431a"/>
    </linearGradient>
    <clipPath id="round"><circle cx="80" cy="80" r="80"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="160" height="160" fill="url(#bg)"/>
    <circle cx="128" cy="34" r="30" fill="#fff" opacity="0.28"/>
    <circle cx="26" cy="126" r="22" fill="#fff" opacity="0.18"/>

    <!-- shoulders -->
    <path d="M22 160c0-28 26-44 58-44s58 16 58 44z" fill="url(#jacket)"/>
    <path d="M64 118l16 20 16-20-16-8z" fill="#fdfdfd"/>

    <!-- neck + face -->
    <rect x="70" y="96" width="20" height="18" rx="9" fill="#f0b48c"/>
    <ellipse cx="80" cy="74" rx="30" ry="33" fill="#ffd5b4"/>

    <!-- hair -->
    <path d="M80 32c-22 0-33 15-33 36 0 5 1 10 2 13 1-11 4-19 8-24 10 5 26 6 42 1 5 4 8 12 9 23 1-4 2-8 2-13 0-21-8-36-30-36z" fill="url(#hair)"/>
    <path d="M50 56c6-14 18-22 30-22 8 0 15 3 20 8-14 10-34 14-50 14z" fill="#3a4160"/>

    <!-- eyes -->
    <ellipse cx="68" cy="76" rx="6" ry="8" fill="#fff"/>
    <ellipse cx="92" cy="76" rx="6" ry="8" fill="#fff"/>
    <circle cx="68.5" cy="77" r="4.6" fill="#2b3350"/>
    <circle cx="92.5" cy="77" r="4.6" fill="#2b3350"/>
    <circle cx="70" cy="74.5" r="1.7" fill="#fff"/>
    <circle cx="94" cy="74.5" r="1.7" fill="#fff"/>
    <path d="M60 67c4-3 10-3 14-1" stroke="#232942" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M100 67c-4-3-10-3-14-1" stroke="#232942" stroke-width="2.6" fill="none" stroke-linecap="round"/>

    <!-- blush + mouth -->
    <ellipse cx="60" cy="87" rx="5" ry="3" fill="#ff9d86" opacity="0.55"/>
    <ellipse cx="100" cy="87" rx="5" ry="3" fill="#ff9d86" opacity="0.55"/>
    <path d="M75 92c3 3 7 3 10 0" stroke="#c4705a" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  </g>
</svg>
